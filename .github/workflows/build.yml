name: Build packages

# packages are built for releases (tags v*) and on demand, not for every commit
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'fnport/**'
      - 'luci-app-fnport/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# read-only by default; only the release job may write
permissions:
  contents: read

jobs:
  build:
    name: OpenWrt ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # packages are arch-independent (ucode/shell/js), so one SDK per release is enough
        release: [ '24.10', '25.12' ]
    steps:
      # third-party actions are pinned to commits so a moved tag or branch cannot change the build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434  # main, 2026-08-04
        env:
          ARCH: x86_64-openwrt-${{ matrix.release }}
          FEEDNAME: fnport
          PACKAGES: fnport luci-app-fnport
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true

      - name: Collect packages
        run: |
          mkdir -p dist
          find bin/packages -path '*/fnport/*' \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: openwrt-${{ matrix.release }}
          path: dist/*

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/*
