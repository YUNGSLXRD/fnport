name: Build packages

# packages are built for releases (tags v*) and on demand, not for every commit
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'fnport/**'
      - 'luci-app-fnport/**'
      - 'windows/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# read-only by default; only the release job may write
permissions:
  contents: read

jobs:
  build:
    name: OpenWrt ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # packages are arch-independent (ucode/shell/js), so one SDK per release is enough
        release: [ '24.10', '25.12' ]
    steps:
      # third-party actions are pinned to commits so a moved tag or branch cannot change the build
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434  # main, 2026-08-04
        env:
          ARCH: x86_64-openwrt-${{ matrix.release }}
          FEEDNAME: fnport
          PACKAGES: fnport luci-app-fnport
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true

      - name: Collect packages
        run: |
          mkdir -p dist
          find bin/packages -path '*/fnport/*' \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: openwrt-${{ matrix.release }}
          path: dist/*

  # the program for Windows, cross-built on Linux: no router needed
  windows:
    name: Windows app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # git describe names untagged builds

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.24.7'
          cache: false

      - name: Build
        # tests, the Windows build, wintun.dll checked against its hash, the zip
        run: windows/build.sh ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows
          # the probe was a tool for building the app; releases carry the app only
          path: windows/dist/fnport-windows-v*.zip

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # signs the build attestation
      attestations: write   # stores it on GitHub
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true

      # checksums of every file of the release, and fnport.exe out of the zip so it can be checked
      # on its own (wintun.dll is WireGuard's, signed by them, not built here)
      - name: Checksums
        run: |
          unzip -j -o dist/fnport-windows-*.zip 'fnport/fnport.exe' -d attest
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      # GitHub's own record that these files were built here from this commit:
      # gh attestation verify <file> -R YUNGSLXRD/fnport
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*
            attest/fnport.exe

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/*
