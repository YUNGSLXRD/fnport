name: Build packages

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: OpenWrt ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # packages are arch-independent (ucode/shell/js), so one SDK per release is enough
        release: [ '24.10', '25.12' ]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-openwrt-${{ matrix.release }}
          FEEDNAME: fnport
          PACKAGES: fnport luci-app-fnport
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true

      - name: Collect packages
        run: |
          mkdir -p dist
          find bin/packages -path '*/fnport/*' \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.release }}
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
