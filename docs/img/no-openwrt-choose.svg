<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Какой вариант выбрать без роутера с OpenWrt</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="0.5" y="0.5" width="779" height="399" rx="12" fill="#ffffff" stroke="#d0d7de"/><rect x="270" y="24" width="240" height="50" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="390.0" y="49.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#3d2a00">Есть роутер с OpenWrt?</text><rect x="560" y="24" width="196" height="50" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="658.0" y="40.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0f3d1e">Ставьте fnport</text><text x="658.0" y="58.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0f3d1e">раздел «Установка»</text><rect x="270" y="140" width="240" height="58" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="390.0" y="160.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#3d2a00">Ваш роутер есть</text><text x="390.0" y="178.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#3d2a00">в списке OpenWrt?</text><rect x="24" y="312" width="220" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="134.0" y="335.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0a2f5c">Вариант 1</text><text x="134.0" y="353.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0a2f5c">прошить свой роутер</text><rect x="280" y="312" width="220" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="390.0" y="335.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0a2f5c">Вариант 2</text><text x="390.0" y="353.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0a2f5c">добавить устройство с OpenWrt</text><rect x="536" y="312" width="220" height="64" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="646.0" y="335.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0a2f5c">Вариант 3</text><text x="646.0" y="353.0" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0a2f5c">OpenWrt в виртуальной машине</text><line x1="510" y1="49.0" x2="560" y2="49.0" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="521.4" y="21.0" width="27.2" height="23" rx="4" fill="#ffffff" stroke="#d0d7de"/><text x="535.0" y="32.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57606a">Да</text><line x1="390.0" y1="74" x2="390.0" y2="140" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="373.1" y="95.5" width="33.8" height="23" rx="4" fill="#ffffff" stroke="#d0d7de"/><text x="390.0" y="107.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57606a">Нет</text><line x1="390.0" y1="198" x2="134.0" y2="312" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="176.60000000000002" y="247.39999999999998" width="119.6" height="38" rx="4" fill="#ffffff" stroke="#d0d7de"/><text x="236.4" y="258.9" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57606a">Да, и не страшно</text><text x="236.4" y="273.9" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57606a">его перепрошить</text><line x1="390.0" y1="198" x2="390.0" y2="312" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="310.4" y="236.0" width="159.2" height="38" rx="4" fill="#ffffff" stroke="#d0d7de"/><text x="390.0" y="247.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57606a">Нет, или это Keenetic,</text><text x="390.0" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57606a">или роутер провайдера</text><line x1="390.0" y1="198" x2="646.0" y2="312" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="497.0" y="247.39999999999998" width="93.19999999999999" height="38" rx="4" fill="#ffffff" stroke="#d0d7de"/><text x="543.6" y="258.9" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57606a">Роутера нет,</text><text x="543.6" y="273.9" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#57606a">только ПК</text></svg>
